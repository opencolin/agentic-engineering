<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events — Automate Engineering</title>
  <meta name="description" content="A live map of agentic-engineering events worldwide — conferences, meetups, workshops, hackathons, and book launches.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="./events.css">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('ae-theme');
        var theme = stored || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body class="events-page">
  <a href="#events-main" class="skip-to-content">Skip to content</a>
  <header class="topbar">
    <button class="sidebar-toggle" aria-label="Toggle events list" aria-expanded="false" aria-controls="events-sidebar">&#9776;</button>
    <a href="../" class="topbar-brand"><span>&gt;_</span> Automate Engineering</a>
    <div class="topbar-events-title">Events</div>
    <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to light mode" title="Switch to light mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </header>

  <div class="events-layout">
    <aside id="events-sidebar" class="events-sidebar" aria-label="Upcoming events">
      <div class="events-sidebar-header">
        <h2>Upcoming</h2>
        <span class="events-count" id="events-count"></span>
      </div>
      <ol class="events-list" id="events-list" role="list">
        <li class="events-empty">Loading events…</li>
      </ol>
      <footer class="events-sidebar-footer">
        <a href="https://github.com/opencolin/agentic-engineering/blob/main/events/events.json" target="_blank" rel="noopener">Edit on GitHub →</a>
      </footer>
    </aside>

    <main id="events-main" class="events-main" tabindex="-1">
      <div id="events-map" role="application" aria-label="World map of agentic-engineering events"></div>
      <div class="events-map-legend">
        <span class="legend-dot"></span> Confirmed event
        <span class="legend-dot flagship"></span> Flagship
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="./events.js"></script>
  <script src="../js/theme.js"></script>
</body>
</html>
