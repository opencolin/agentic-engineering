<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Automate Engineering</title>
  <meta name="description" content="Get in touch with the Automate Engineering team — questions, corrections, suggestions, or just hello.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .contact-wrap {
      max-width: 640px;
      margin: 3rem auto;
      padding: 0 1.5rem;
    }
    .contact-wrap h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    .contact-wrap .lede {
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }
    .contact-form { display: flex; flex-direction: column; gap: 1.25rem; }
    .contact-form label {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      font-size: 0.875rem;
      color: var(--text-secondary);
    }
    .contact-form input,
    .contact-form textarea {
      font: inherit;
      color: var(--text-primary);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.6rem 0.75rem;
      transition: border-color 0.15s ease;
    }
    .contact-form input:focus,
    .contact-form textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .contact-form textarea { min-height: 160px; resize: vertical; }
    .contact-form button {
      align-self: flex-start;
      padding: 0.6rem 1.25rem;
      background: var(--accent);
      color: #0a0a0f;
      border: 0;
      border-radius: 6px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    .contact-form button:disabled { opacity: 0.5; cursor: wait; }
    .contact-status {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .contact-status.success { background: rgba(80, 200, 120, 0.1); border: 1px solid rgba(80, 200, 120, 0.4); color: #50c878; }
    .contact-status.error   { background: rgba(220, 80, 80, 0.1); border: 1px solid rgba(220, 80, 80, 0.4); color: #dc5050; }
    .contact-status[hidden] { display: none; }
    .hp-field { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="/" class="topbar-brand" style="grid-column: 1 / -1; padding-left: 1.5rem;"><span>&gt;_</span> Automate Engineering</a>
  </header>
  <main class="contact-wrap">
    <h1>Contact</h1>
    <p class="lede">Questions, corrections, suggestions, or just hello — drop a note. We read every one.</p>
    <form class="contact-form" id="contact-form" novalidate>
      <label>
        Name
        <input type="text" name="name" required autocomplete="name" maxlength="200">
      </label>
      <label>
        Email
        <input type="email" name="email" required autocomplete="email" maxlength="320">
      </label>
      <label>
        Message
        <textarea name="message" required maxlength="5000"></textarea>
      </label>
      <input type="text" name="website" class="hp-field" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit" id="contact-submit">Send</button>
      <div class="contact-status" id="contact-status" hidden role="status" aria-live="polite"></div>
    </form>
  </main>
  <script>
    (function () {
      var form = document.getElementById('contact-form');
      var btn = document.getElementById('contact-submit');
      var status = document.getElementById('contact-status');
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        status.hidden = true;
        status.className = 'contact-status';
        var fd = new FormData(form);
        var body = {
          name: (fd.get('name') || '').toString().trim(),
          email: (fd.get('email') || '').toString().trim(),
          message: (fd.get('message') || '').toString().trim(),
          website: (fd.get('website') || '').toString()
        };
        if (!body.name || !body.email || !body.message) {
          status.textContent = 'All fields required.';
          status.classList.add('error');
          status.hidden = false;
          return;
        }
        btn.disabled = true;
        btn.textContent = 'Sending…';
        fetch('/api/contact', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        }).then(function (r) {
          return r.json().then(function (j) { return { ok: r.ok, body: j }; });
        }).then(function (res) {
          btn.disabled = false;
          btn.textContent = 'Send';
          if (res.ok) {
            form.reset();
            status.textContent = 'Thanks — message sent. We’ll be in touch.';
            status.classList.add('success');
          } else {
            status.textContent = (res.body && res.body.error) || 'Something went wrong. Try again in a minute.';
            status.classList.add('error');
          }
          status.hidden = false;
        }).catch(function () {
          btn.disabled = false;
          btn.textContent = 'Send';
          status.textContent = 'Network error. Try again.';
          status.classList.add('error');
          status.hidden = false;
        });
      });
    })();
  </script>
</body>
</html>
