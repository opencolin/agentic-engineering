name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  hype-word-lint:
    name: Hype-word linter (editorial commandment #4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run check-hype-words.sh
        run: bash scripts/check-hype-words.sh

  astro-build:
    name: Astro build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx astro check
      - run: npx astro build
