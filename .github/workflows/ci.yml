name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-check:
    name: build hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run build
        run: bash build.sh

      - name: Verify index.html was generated
        run: test -s index.html
